spring.application.name=ms-rutaexpress-shipments
server.port=${SERVER_PORT:5000}

# Punto de verificación seguro para Docker, AWS y monitoreo básico.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=ms-rutaexpress-shipments
info.app.description=Microservicio de envios de RutaExpress

# URL interna configurable para Docker y despliegue en AWS.
catalog.base-url=${CATALOGO_URL:http://localhost:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shipments_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rutaexpress}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
