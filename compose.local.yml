services:
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: RUTAEXPRESS
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  shipments:
    build:
      context: .
    environment:
      SERVER_PORT: 5000
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: RUTAEXPRESS
      SPRING_DATASOURCE_PASSWORD: ${APP_USER_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      # Solo desarrollo local: crea o actualiza la tabla a partir de la entidad JPA.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
    ports:
      - "5000:5000"
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle-data:
